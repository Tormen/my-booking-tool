# Add these location blocks to your existing server block -- the rest of
# the site (static index.html, favicon, etc.) keeps being served exactly
# as it is today.
# After editing: sudo nginx -t && sudo systemctl reload nginx
#
# SELinux (enforcing by default on Fedora): nginx runs as the confined
# httpd_t domain, which is NOT allowed to proxy_pass to an arbitrary local
# port by default. Without this, every request through these blocks 502s
# with an AVC denial (check `sudo ausearch -m avc -ts recent`), even though
# the app itself is running fine:
#   sudo setsebool -P httpd_can_network_connect on
# (the RPM's %post also prints this reminder after install)

location /courses {
    proxy_pass http://127.0.0.1:8811;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

